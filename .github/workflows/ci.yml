name: CI

# Triggered on every push to main and on every pull request targeting main.
# Both jobs run in parallel — frontend (Next.js / RoyCSS library) and
# backend (Express + Prisma API) live in separate dependency trees so
# there is no benefit from serializing them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight CI run when a new commit lands on the same ref —
# keeps PR feedback fast and frees runners. Releases (workflow_run)
# are NOT affected by this concurrency group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Frontend — lint, typecheck, vitest unit tests, build the package
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint + typecheck + unit + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI builds — this is the version the
          # frozen-lockfile install + postinstall prisma generate flow
          # was verified against (issue #59 verification protocol).
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint (eslint)
        run: bun run lint

      # REQUIRED gate — do not weaken. Fails on main today for two known
      # reasons being fixed in parallel (issue #60):
      #   1. Root tsconfig scope bleed — backend-node/ + mini-services/ have
      #      their own dependency trees and are compiled by the root tsc run.
      #   2. recharts v3 ChartTooltip typing (chart.tsx, charts.tsx,
      #      analytics-dashboard.tsx).
      # Until #60 lands, this step is expected red; the job correctly fails.
      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

      # `!cancelled()` (not `always()`) so these verification steps still
      # run and report signal when the typecheck gate above is red (see
      # #60 note) — but never after a run is cancelled. They do NOT weaken
      # the gate: any failed step still fails the job.
      # Coverage floor (issue #84 / PF-006): thresholds live in
      # vitest.config.ts (80 % statements / 70 % branches). `--coverage`
      # is REQUIRED for thresholds to be enforced — a plain `vitest run`
      # never evaluates them.
      - name: Unit tests + coverage floor (vitest)
        if: ${{ !cancelled() }}
        run: bunx vitest run --coverage
        env:
          # RoyCSS lib unit tests are pure TS — no DB, no network — but
          # vitest still reads process.env for any incidental imports.
          NODE_ENV: test

      # Bundle-size gate (issue #84 / PF-006): ratchet limits for the
      # shipped npm artifacts in dist/ (.size-limit.json). Runs AFTER
      # build:package so dist/ reflects THIS commit, not the last tag.
      - name: Build package (scripts/build-package.ts → dist/)
        if: ${{ !cancelled() }}
        run: bun run build:package

      - name: Bundle-size gate (size-limit)
        if: ${{ !cancelled() }}
        run: bunx size-limit

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roycss-dist
          path: dist/
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Backend — typecheck, Prisma generate + push to a throwaway test DB,
  # then run the integration suite via supertest + vitest.
  # ─────────────────────────────────────────────────────────────────────
  backend-node:
    name: Backend (Node) — typecheck + db + integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    env:
      # Throwaway SQLite file — never the production dev.db. The vitest
      # globalSetup (tests/integration/setup.ts) runs
      # `bunx prisma db push --skip-generate --accept-data-loss` against
      # this path before the integration suite starts.
      DATABASE_URL: "file:./test.db"
      NODE_ENV: test
      # The integration suite does not exercise auth flows that depend
      # on a strong JWT secret, but the env schema rejects short secrets.
      JWT_SECRET: "ci-test-jwt-secret-not-for-production-use-64chars"
      JWT_REFRESH_SECRET: "ci-test-jwt-refresh-secret-different-from-access-64chars"
      # Effects data lives in the parent project's dist/ folder; the
      # backend reads it via a relative path from the backend-node root.
      EFFECTS_DATA_PATH: "../dist/effects.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI builds — same version as the
          # frontend job (verified: issue #59 verification protocol).
          bun-version: "1.3.14"

      - name: Build parent dist/effects.json (dependency of backend integration tests)
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run build:package

      - name: Install backend-node dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # REQUIRED gate — do not weaken. Fails on main today because
      # src/server/app.ts imports ../modules/inspector/routes.js, which
      # does not exist yet (68 routers, 67 module dirs). Tracked in issue
      # #57 — a parallel fix is in flight. Until it lands, this step is
      # expected red; the job correctly fails.
      - name: Typecheck backend-node (tsc --noEmit)
        run: bun run typecheck

      # `!cancelled()` so the DB provisioning + integration steps still
      # run and report signal while the typecheck gate above is red (see
      # #57 note) — but never after a run is cancelled. They do NOT weaken
      # the gate: any failed step still fails the job.
      - name: Prisma generate
        if: ${{ !cancelled() }}
        run: bun run db:generate

      - name: Prisma db push (test DB)
        if: ${{ !cancelled() }}
        run: bun run db:push
        env:
          DATABASE_URL: "file:./test.db"

      - name: Typecheck integration tests (tsc -p tsconfig.test.json)
        if: ${{ !cancelled() }}
        run: bun run typecheck:tests

      - name: Integration tests (vitest + supertest)
        if: ${{ !cancelled() }}
        run: bun run test:integration
        env:
          DATABASE_URL: "file:./test.db"

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-node-coverage
          path: backend-node/coverage/
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Perf gate (issue #84 / PF-006) — page-level performance budgets.
  # `bun run perf:budget` (scripts/perf-budget.ts) is self-contained:
  # it verifies .next/BUILD_ID, starts `next start` on :3310, measures
  # runtime metrics with headless Chromium (Playwright), parses the
  # worst-of-N Lighthouse reports produced by the LHCI step, writes
  # perf/results/budget-report.json, and exits non-zero when any metric
  # breaches its perf/budget.json budget. Requires a production build.
  # Lighthouse runs FIRST (LHCI `collect` + `assert`) so the budget gate
  # can consume .lighthouseci/ reports; the LHCI assertions themselves
  # (lighthouserc.json) also gate this job independently.
  # ─────────────────────────────────────────────────────────────────────
  perf-gate:
    name: Perf gate — budget.json + Lighthouse
    # Pushes to main only — on pull requests the identical gate runs in
    # .github/workflows/lighthouse.yml (which additionally posts the
    # scores as a PR comment), so running both would duplicate ~4 min of
    # Chromium measurement per PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: bunx playwright install chromium --with-deps

      - name: Production build (next build)
        run: bun run build

      - name: Lighthouse CI (collect + assert, worst-of-3)
        run: |
          bunx @lhci/cli autorun --config=lighthouserc.json || {
            # `autorun` includes an `upload` section pointed at temporary
            # public storage; on runner-network hiccups we still want the
            # assert results — rerun collect+assert only.
            bunx @lhci/cli collect --config=lighthouserc.json
            bunx @lhci/cli assert --config=lighthouserc.json
          }

      - name: Performance budget gate (perf:budget)
        run: bun run perf:budget --require-lighthouse

      - name: Upload budget report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-budget-report
          path: perf/results/budget-report.json
          if-no-files-found: warn
          retention-days: 30
