<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RoyCSS Inspector</title>
  <style>
    /* ─── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: oklch(0.95 0.005 240);
      background: oklch(0.18 0.01 240);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; cursor: pointer; }

    /* ─── Header ────────────────────────────────────────────── */
    .roycss-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: oklch(0.22 0.02 264);
      border-bottom: 1px solid oklch(0.30 0.02 264);
      flex-shrink: 0;
    }
    .roycss-header__logo {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, oklch(0.70 0.22 264), oklch(0.55 0.25 290));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: #fff;
      flex-shrink: 0;
    }
    .roycss-header__title {
      font-weight: 700; font-size: 14px;
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .roycss-header__count {
      font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 3px 8px;
      background: oklch(0.30 0.02 264);
      border-radius: 10px;
      color: oklch(0.85 0.05 264);
      flex-shrink: 0;
    }

    /* ─── Search ────────────────────────────────────────────── */
    .roycss-search {
      padding: 8px 14px;
      border-bottom: 1px solid oklch(0.25 0.01 240);
      flex-shrink: 0;
    }
    .roycss-search input {
      width: 100%;
      padding: 7px 10px;
      background: oklch(0.22 0.01 240);
      border: 1px solid oklch(0.30 0.02 264);
      border-radius: 6px;
      color: inherit;
      font: inherit;
      outline: none;
    }
    .roycss-search input:focus {
      border-color: oklch(0.62 0.22 264);
    }
    .roycss-search input::placeholder { color: oklch(0.55 0.01 240); }

    /* ─── Main scroll area ──────────────────────────────────── */
    .roycss-main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ─── Empty state ───────────────────────────────────────── */
    .roycss-empty {
      padding: 40px 20px;
      text-align: center;
      color: oklch(0.65 0.01 240);
      font-size: 13px;
      line-height: 1.6;
    }
    .roycss-empty__icon { font-size: 28px; margin-bottom: 8px; opacity: 0.5; }

    /* ─── Category ──────────────────────────────────────────── */
    .roycss-category {
      border-bottom: 1px solid oklch(0.22 0.01 240);
    }
    .roycss-category__header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: oklch(0.20 0.01 240);
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: oklch(0.80 0.01 240);
    }
    .roycss-category__chevron {
      transition: transform 120ms ease;
      font-size: 10px;
      opacity: 0.7;
    }
    .roycss-category--collapsed .roycss-category__chevron {
      transform: rotate(-90deg);
    }
    .roycss-category__name { flex: 1; min-width: 0; }
    .roycss-category__count {
      font: 600 11px ui-monospace, monospace;
      padding: 2px 7px;
      background: oklch(0.27 0.01 240);
      border-radius: 8px;
      color: oklch(0.80 0.01 240);
    }
    .roycss-category__body { display: block; }
    .roycss-category--collapsed .roycss-category__body { display: none; }

    /* ─── Effect row ────────────────────────────────────────── */
    .roycss-effect {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px 7px 28px;
      cursor: pointer;
      border-left: 2px solid transparent;
    }
    .roycss-effect:hover {
      background: oklch(0.23 0.01 240);
      border-left-color: oklch(0.50 0.20 264);
    }
    .roycss-effect--selected {
      background: oklch(0.27 0.03 264 / 0.30);
      border-left-color: oklch(0.65 0.22 264);
    }
    .roycss-effect__name {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 500;
    }
    .roycss-effect__class {
      font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      color: oklch(0.60 0.01 240);
      flex-shrink: 0;
    }
    .roycss-effect__count {
      font: 600 11px ui-monospace, monospace;
      padding: 1px 6px;
      background: oklch(0.30 0.02 264);
      border-radius: 8px;
      color: oklch(0.85 0.05 264);
      flex-shrink: 0;
    }

    /* ─── Detail pane ───────────────────────────────────────── */
    .roycss-detail {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 50%;
      max-width: 600px;
      background: oklch(0.20 0.01 240);
      border-left: 1px solid oklch(0.30 0.02 264);
      display: none;
      flex-direction: column;
      box-shadow: -4px 0 16px rgba(0,0,0,0.30);
    }
    .roycss-detail--open { display: flex; }
    .roycss-detail__header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid oklch(0.25 0.01 240);
      flex-shrink: 0;
    }
    .roycss-detail__title {
      flex: 1; min-width: 0;
      font-weight: 700; font-size: 14px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .roycss-detail__close {
      background: transparent;
      border: none;
      color: oklch(0.65 0.01 240);
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .roycss-detail__close:hover {
      background: oklch(0.27 0.01 240);
      color: oklch(0.95 0.01 240);
    }
    .roycss-detail__body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }
    .roycss-detail__row {
      display: flex;
      gap: 8px;
      padding: 4px 0;
      font-size: 12px;
    }
    .roycss-detail__label {
      flex-shrink: 0;
      width: 80px;
      color: oklch(0.55 0.01 240);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.05em;
      padding-top: 2px;
    }
    .roycss-detail__value {
      flex: 1; min-width: 0;
      word-break: break-word;
    }
    .roycss-detail__value code {
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      background: oklch(0.25 0.01 240);
      padding: 1px 5px;
      border-radius: 3px;
    }
    .roycss-detail__tags {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-top: 2px;
    }
    .roycss-detail__tag {
      font: 11px ui-monospace, monospace;
      padding: 1px 6px;
      background: oklch(0.27 0.02 264);
      color: oklch(0.85 0.05 264);
      border-radius: 8px;
    }
    .roycss-detail__section {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid oklch(0.25 0.01 240);
    }
    .roycss-detail__section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: oklch(0.55 0.01 240);
      margin: 0 0 6px 0;
    }
    .roycss-detail__code {
      background: oklch(0.16 0.01 240);
      border: 1px solid oklch(0.25 0.01 240);
      border-radius: 6px;
      padding: 10px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: oklch(0.88 0.01 240);
      overflow-x: auto;
      max-height: 360px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }
    .roycss-detail__actions {
      display: flex; gap: 6px;
      margin-top: 10px;
    }
    .roycss-detail__btn {
      padding: 5px 10px;
      background: oklch(0.27 0.02 264);
      border: 1px solid oklch(0.35 0.02 264);
      border-radius: 5px;
      color: oklch(0.90 0.02 264);
      font-size: 12px;
      font-weight: 500;
    }
    .roycss-detail__btn:hover { background: oklch(0.32 0.03 264); }
    .roycss-detail__btn--primary {
      background: oklch(0.62 0.22 264);
      border-color: oklch(0.62 0.22 264);
      color: #fff;
    }
    .roycss-detail__btn--primary:hover {
      background: oklch(0.55 0.22 264);
    }

    /* ─── Loading ───────────────────────────────────────────── */
    .roycss-loading {
      padding: 20px 14px;
      text-align: center;
      color: oklch(0.60 0.01 240);
      font-size: 12px;
    }

    /* ─── Scrollbars ────────────────────────────────────────── */
    .roycss-main::-webkit-scrollbar,
    .roycss-detail__body::-webkit-scrollbar,
    .roycss-detail__code::-webkit-scrollbar {
      width: 10px; height: 10px;
    }
    .roycss-main::-webkit-scrollbar-track,
    .roycss-detail__body::-webkit-scrollbar-track,
    .roycss-detail__code::-webkit-scrollbar-track {
      background: transparent;
    }
    .roycss-main::-webkit-scrollbar-thumb,
    .roycss-detail__body::-webkit-scrollbar-thumb,
    .roycss-detail__code::-webkit-scrollbar-thumb {
      background: oklch(0.30 0.01 240);
      border-radius: 5px;
    }
    .roycss-main::-webkit-scrollbar-thumb:hover,
    .roycss-detail__body::-webkit-scrollbar-thumb:hover,
    .roycss-detail__code::-webkit-scrollbar-thumb:hover {
      background: oklch(0.40 0.01 240);
    }
  </style>
</head>
<body>
  <header class="roycss-header">
    <div class="roycss-header__logo">R</div>
    <div class="roycss-header__title">RoyCSS Inspector</div>
    <div class="roycss-header__count" id="header-count" title="Total RoyCSS classes detected on this page">— classes</div>
  </header>

  <div class="roycss-search">
    <input
      type="search"
      id="search"
      placeholder="Filter by effect id, name, category, or tag…"
      autocomplete="off"
      spellcheck="false"
    />
  </div>

  <main class="roycss-main" id="main">
    <div class="roycss-loading" id="loading">Scanning page for RoyCSS classes…</div>
  </main>

  <aside class="roycss-detail" id="detail" aria-hidden="true">
    <header class="roycss-detail__header">
      <div class="roycss-detail__title" id="detail-title">—</div>
      <button
        type="button"
        class="roycss-detail__close"
        id="detail-close"
        aria-label="Close detail pane"
        title="Close"
      >×</button>
    </header>
    <div class="roycss-detail__body" id="detail-body">
      <!-- populated by panel.js -->
    </div>
  </aside>

  <script src="panel.js"></script>
</body>
</html>
