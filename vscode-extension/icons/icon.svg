<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="RoyCSS extension icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>

  <!-- Bracket open -->
  <path d="M40 38 C30 38 26 44 26 56 L26 72 C26 80 22 84 16 84 C22 84 26 88 26 96 L26 104 C26 116 30 122 40 122"
        fill="none" stroke="url(#mark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bracket close -->
  <path d="M88 38 C98 38 102 44 102 56 L102 72 C102 80 106 84 112 84 C106 84 102 88 102 96 L102 104 C102 116 98 122 88 122"
        fill="none" stroke="url(#mark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "R" mark for RoyCSS -->
  <text x="64" y="78"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="52" font-weight="800"
        text-anchor="middle" dominant-baseline="middle"
        fill="url(#mark)">R</text>

  <!-- Animated dot -->
  <circle cx="64" cy="100" r="5" fill="#fde68a"/>
</svg>
