<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RoyCSS Inspector — Live Panel</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="roycss-sp__header">
      <div class="roycss-sp__brand">
        <span class="roycss-sp__logo" aria-hidden="true">R</span>
        <div>
          <h1>RoyCSS Inspector</h1>
          <p class="roycss-sp__subtitle">Live inspector · top 100 embedded</p>
        </div>
      </div>
      <div class="roycss-sp__status" id="page-status" title="RoyCSS classes on this page">
        <span class="roycss-sp__status-num" id="page-count">—</span>
        <span class="roycss-sp__status-label">on page</span>
      </div>
    </header>

    <main class="roycss-sp__main">
      <section class="roycss-sp__effect" id="effect-card">
        <div class="roycss-sp__effect-head">
          <h2 id="effect-name">Select an effect</h2>
          <span id="effect-category" class="roycss-sp__chip">—</span>
        </div>
        <p id="effect-description" class="roycss-sp__desc">
          Click a badge on the page, or pick an effect from the list below.
        </p>
        <div id="effect-tags" class="roycss-sp__tags" aria-label="Tags"></div>
        <code id="effect-class" class="roycss-sp__effect-class"></code>
      </section>

      <section class="roycss-sp__css">
        <div class="roycss-sp__css-head">
          <span class="roycss-sp__css-label">CSS source</span>
          <button type="button" id="copy-css-btn" class="roycss-sp__copy">Copy CSS</button>
        </div>
        <pre class="roycss-sp__code"><code id="effect-css"></code></pre>
      </section>

      <section class="roycss-sp__frameworks">
        <div role="tablist" class="roycss-sp__tabs" id="framework-tabs">
          <!-- tabs injected by sidepanel.ts -->
        </div>
        <div role="tabpanel" class="roycss-sp__tabpanel" id="framework-panel">
          <!-- panel injected by sidepanel.ts -->
        </div>
      </section>
    </main>

    <footer class="roycss-sp__footer">
      RoyCSS Inspector · v1.0.0 · Manifest V3 · No analytics
    </footer>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
