<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RoyCSS Inspector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="roycss-popup__header">
      <div class="roycss-popup__brand">
        <span class="roycss-popup__logo" aria-hidden="true">R</span>
        <div>
          <h1>RoyCSS Inspector</h1>
          <p class="roycss-popup__subtitle">v1.0.0 · Manifest V3</p>
        </div>
      </div>
      <label class="roycss-popup__toggle">
        <input type="checkbox" id="inspector-toggle" checked />
        <span class="roycss-popup__switch" aria-hidden="true"></span>
        <span class="roycss-popup__toggle-label">Active</span>
      </label>
    </header>

    <section class="roycss-popup__count">
      <div class="roycss-popup__count-num" id="scan-count">—</div>
      <div class="roycss-popup__count-label">RoyCSS classes detected</div>
    </section>

    <section class="roycss-popup__list-wrap">
      <h2 class="roycss-popup__list-title">Top effects on this page</h2>
      <ul id="effect-list" class="roycss-popup__list">
        <li class="roycss-popup__empty">No scan yet — click “Rescan page”.</li>
      </ul>
    </section>

    <section class="roycss-popup__actions">
      <button type="button" id="rescan-btn" class="roycss-popup__btn">
        Rescan page
      </button>
      <button type="button" id="open-panel-btn" class="roycss-popup__btn roycss-popup__btn--primary">
        Open inspector panel
      </button>
    </section>

    <footer class="roycss-popup__footer">
      <span>Read-only · No analytics · No remote code</span>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
