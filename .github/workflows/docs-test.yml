name: Docs quality gate

on:
  pull_request:
    paths:
      - "src/app/docs/**"
      - "src/components/docs/**"
      - "src/lib/docs-sitemap.ts"
      - "src/lib/docs-feedback.ts"
      - ".github/workflows/docs-test.yml"
  push:
    branches: [main]
    paths:
      - "src/app/docs/**"
      - "src/components/docs/**"
      - "src/lib/docs-sitemap.ts"
      - "src/lib/docs-feedback.ts"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint docs surface
        run: bunx eslint src/app/docs src/components/docs src/lib/docs-sitemap.ts src/lib/docs-feedback.ts

      - name: Typecheck docs surface (compiles every JSX code sample literal)
        run: bunx tsc --noEmit

      - name: Unit tests (docs feedback + sitemap/versioning contracts)
        run: bunx vitest run tests/unit/docs-feedback.test.ts tests/unit/docs-sitemap.test.ts

      # Full docs-sample CI (extract + compile + render each code block)
      # is tracked in the roadmap and currently blocked by Actions
      # billing (owner action, issue #75). The gates above still
      # typecheck every docs page component including inline JSX.
