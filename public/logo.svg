<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    RoyCSS Logo — Concept 1: "Modern • Clean • Code"
    Stylized "R" with gradient + code brackets { } in the negative space
    Colors: White, Electric Blue, Purple/Indigo gradient
  -->
  <defs>
    <linearGradient id="r-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00A8FF"/>
    </linearGradient>
    <linearGradient id="bracket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded dark square -->
  <rect width="120" height="120" rx="28" fill="#0F1729"/>

  <!-- R letterform — left vertical bar -->
  <rect x="30" y="28" width="14" height="64" rx="7" fill="url(#r-grad)"/>

  <!-- R letterform — top bowl (curved section) -->
  <path d="M44 28 L64 28 C78 28 84 36 84 46 C84 56 78 64 64 64 L44 64"
        stroke="url(#r-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- R letterform — diagonal leg -->
  <path d="M46 64 L82 92" stroke="url(#r-grad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Code brackets { } in the negative space of the R -->
  <!-- Left bracket { -->
  <path d="M64 40 C60 40 60 44 56 44 C52 44 52 48 52 52 C52 56 52 60 56 60 C60 60 60 64 64 64"
        stroke="url(#bracket-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  
  <!-- Right bracket } -->
  <path d="M72 40 C76 40 76 44 80 44 C84 44 84 48 84 52 C84 56 84 60 80 60 C76 60 76 64 72 64"
        stroke="url(#bracket-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>

  <!-- Small dot/minus between brackets (CSS property indicator) -->
  <circle cx="68" cy="52" r="2" fill="#00A8FF" opacity="0.6"/>
</svg>
