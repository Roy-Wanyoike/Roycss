<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    RoyCSS Logo — Modern, geometric "R" monogram
    - Emerald gradient on dark background
    - Clean geometric shapes
    - Works at all sizes (favicon to hero)
    - SVG-first, optimized for fast loading
  -->
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="logo-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square with dark fill -->
  <rect width="120" height="120" rx="28" fill="#0a0a0a"/>

  <!-- Geometric "R" mark — constructed from clean shapes -->
  <!-- Left vertical bar -->
  <rect x="32" y="28" width="12" height="64" rx="6" fill="url(#logo-grad)"/>

  <!-- Top arc of the R (the bowl) -->
  <path d="M44 28 L66 28 C78 28 84 36 84 46 C84 56 78 64 66 64 L44 64"
        stroke="url(#logo-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Diagonal leg of the R -->
  <path d="M48 64 L80 92" stroke="url(#logo-grad-light)" stroke-width="12" stroke-linecap="round"/>

  <!-- Accent dot — represents the "CSS" dot / period -->
  <circle cx="96" cy="92" r="5" fill="#34d399"/>
</svg>
