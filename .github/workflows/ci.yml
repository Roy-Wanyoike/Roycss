name: CI

# Triggered on every push to main and on every pull request targeting main.
# Both jobs run in parallel — frontend (Next.js / RoyCSS library) and
# backend (Express + Prisma API) live in separate dependency trees so
# there is no benefit from serializing them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight CI run when a new commit lands on the same ref —
# keeps PR feedback fast and frees runners. Releases (workflow_run)
# are NOT affected by this concurrency group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Frontend — lint, typecheck, vitest unit tests, build the package
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint + typecheck + unit + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI builds — this is the version the
          # frozen-lockfile install + postinstall prisma generate flow
          # was verified against (issue #59 verification protocol).
          bun-version: "1.3.14"

      # Malformed-trigger guard (audit F-09 remediation). A mangled
      # `branches:` value still parses as valid YAML, so GitHub Actions
      # never surfaces an error — the workflow just silently never runs
      # on the intended refs. Dependency-free, so it runs before install
      # for fast signal. (Verification note, task 7-d: the audit's
      # lighthouse.yml `branches: ain]` reading was a terminal-rendering
      # artifact — the committed bytes are a proper flow list, confirmed
      # by hex dump + YAML parse of the blob. This guard now catches that
      # typo class for real; see scripts/check-workflows.ts.)
      - name: Workflow trigger lint (F-09 guard)
        run: bun run scripts/check-workflows.ts

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint (eslint)
        run: bun run lint

      # REQUIRED gate — do not weaken. Fails on main today for two known
      # reasons being fixed in parallel (issue #60):
      #   1. Root tsconfig scope bleed — backend-node/ + mini-services/ have
      #      their own dependency trees and are compiled by the root tsc run.
      #   2. recharts v3 ChartTooltip typing (chart.tsx, charts.tsx,
      #      analytics-dashboard.tsx).
      # Until #60 lands, this step is expected red; the job correctly fails.
      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

      # `!cancelled()` (not `always()`) so these verification steps still
      # run and report signal when the typecheck gate above is red (see
      # #60 note) — but never after a run is cancelled. They do NOT weaken
      # the gate: any failed step still fails the job.
      # Coverage floor (issue #84 / PF-006): thresholds live in
      # vitest.config.ts (80 % statements / 70 % branches). `--coverage`
      # is REQUIRED for thresholds to be enforced — a plain `vitest run`
      # never evaluates them.
      - name: Unit tests + coverage floor (vitest)
        if: ${{ !cancelled() }}
        run: bunx vitest run --coverage
        env:
          # RoyCSS lib unit tests are pure TS — no DB, no network — but
          # vitest still reads process.env for any incidental imports.
          NODE_ENV: test

      # Bundle-size gate (issue #84 / PF-006): ratchet limits for the
      # shipped npm artifacts in dist/ (.size-limit.json). Runs AFTER
      # build:package so dist/ reflects THIS commit, not the last tag.
      - name: Build package (scripts/build-package.ts → dist/)
        if: ${{ !cancelled() }}
        run: bun run build:package

      - name: Bundle-size gate (size-limit)
        if: ${{ !cancelled() }}
        run: bunx size-limit

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roycss-dist
          path: dist/
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Backend — typecheck, Prisma generate + push to a throwaway test DB,
  # then run the integration suite via supertest + vitest.
  # ─────────────────────────────────────────────────────────────────────
  backend-node:
    name: Backend (Node) — typecheck + db + integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    env:
      # Throwaway SQLite file — never the production dev.db. The vitest
      # globalSetup (tests/integration/setup.ts) runs
      # `bunx prisma db push --skip-generate --accept-data-loss` against
      # this path before the integration suite starts.
      DATABASE_URL: "file:./test.db"
      NODE_ENV: test
      # The integration suite does not exercise auth flows that depend
      # on a strong JWT secret, but the env schema rejects short secrets.
      JWT_SECRET: "ci-test-jwt-secret-not-for-production-use-64chars"
      JWT_REFRESH_SECRET: "ci-test-jwt-refresh-secret-different-from-access-64chars"
      # Effects data lives in the parent project's dist/ folder; the
      # backend reads it via a relative path from the backend-node root.
      EFFECTS_DATA_PATH: "../dist/effects.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI builds — same version as the
          # frontend job (verified: issue #59 verification protocol).
          bun-version: "1.3.14"

      - name: Build parent dist/effects.json (dependency of backend integration tests)
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run build:package

      - name: Install backend-node dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # REQUIRED gate — do not weaken. Fails on main today because
      # src/server/app.ts imports ../modules/inspector/routes.js, which
      # does not exist yet (68 routers, 67 module dirs). Tracked in issue
      # #57 — a parallel fix is in flight. Until it lands, this step is
      # expected red; the job correctly fails.
      - name: Typecheck backend-node (tsc --noEmit)
        run: bun run typecheck

      # `!cancelled()` so the DB provisioning + integration steps still
      # run and report signal while the typecheck gate above is red (see
      # #57 note) — but never after a run is cancelled. They do NOT weaken
      # the gate: any failed step still fails the job.
      - name: Prisma generate
        if: ${{ !cancelled() }}
        run: bun run db:generate

      - name: Prisma db push (test DB)
        if: ${{ !cancelled() }}
        run: bun run db:push
        env:
          DATABASE_URL: "file:./test.db"

      - name: Typecheck integration tests (tsc -p tsconfig.test.json)
        if: ${{ !cancelled() }}
        run: bun run typecheck:tests

      - name: Integration tests (vitest + supertest)
        if: ${{ !cancelled() }}
        run: bun run test:integration
        env:
          DATABASE_URL: "file:./test.db"

      # Audit F-22a: this job previously ran ONLY the integration project
      # (`bun run test:integration` path-filters to tests/integration/**),
      # so the suites a local `bun run test` runs — 460 tests across
      # tests/unit, tests/contract and tests/security — never executed in
      # CI. The contract + security files belong to the `integration`
      # vitest project (see vitest.config.ts), so selecting them here
      # picks up the same single-worker + shared-module-registry +
      # globalSetup DB-push isolation contract; the unit files run in
      # their own project with per-file isolation. Job-level env already
      # provides DATABASE_URL / JWT secrets; setup-env.ts forces the
      # throwaway test.db regardless of ambient values. No --coverage: the
      # coverage floor is enforced by the local test:coverage run.
      - name: Unit + contract + security suites (vitest)
        if: ${{ !cancelled() }}
        run: bunx vitest run tests/unit tests/contract tests/security

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-node-coverage
          path: backend-node/coverage/
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # E2E (audit F-22b) — the 10 Playwright specs in tests/e2e/* against a
  # production frontend build + a live backend.
  #
  # Pushes to main ONLY (`if: github.event_name == 'push'` — the
  # workflow's `on:` also fires on pull_request, where lint + typecheck +
  # unit + integration + the PR Lighthouse gate already run): e2e would
  # roughly double PR wall-clock for signal PRs already get. Same gating
  # pattern as the perf-gate job below.
  #
  # Stack wiring (mirrors the proven backend-node job env pattern):
  #   1. `bun run build:package` → dist/effects.json — the backend's
  #      EFFECTS_DATA_PATH catalog (backend reads ../dist/effects.json).
  #   2. Backend: frozen install → prisma generate → schema push to the
  #      same throwaway `file:./test.db` the integration setup uses, then
  #      `bun run dev` (the repo's documented serve command — tsx watch
  #      src/index.ts; matches today's deployed reality, see audit F-03)
  #      on :4000, health-gated on /api/v1/health before anything runs.
  #   3. Frontend: `bun run build` (prisma generate + next build), then
  #      `bun run start` (next start) on :3000 with BACKEND_URL pointing
  #      at the local backend. API_MODE stays `auto` (default): the
  #      gateway probes BACKEND_URL and falls back to the embedded
  #      read-only catalog if the backend is slow to boot, so a backend
  #      race can never flake UI specs (src/lib/api-mode.ts).
  #   4. `bunx playwright test` with PLAYWRIGHT_NO_SERVER=1 (the config
  #      otherwise auto-starts `next dev`) + PLAYWRIGHT_BASE_URL=:3000.
  #
  # Current specs are UI-level and hermetic (the contact-form spec mocks
  # its POST via page.route) — the backend is wired so future specs can
  # exercise real auth/effect endpoints without CI changes.
  # ─────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright (prod build + live backend)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Frontend runtime wiring only — the backend-only vars (DATABASE_URL,
      # JWT secrets, EFFECTS_DATA_PATH) are scoped to the backend steps below
      # so the root `next build` sees exactly the env the proven perf-gate
      # build sees (no ambient DATABASE_URL changing build-time behavior).
      BACKEND_URL: "http://localhost:4000"
      # Playwright config: don't auto-start `next dev` — this job runs a
      # production `next start` instead.
      PLAYWRIGHT_NO_SERVER: "1"
      PLAYWRIGHT_BASE_URL: "http://localhost:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: bunx playwright install chromium --with-deps

      # Backend data dependency: the API serves the effects catalog from
      # the parent project's dist/effects.json.
      - name: Build dist/effects.json (backend catalog dependency)
        run: bun run build:package

      - name: Install backend-node dependencies (frozen lockfile)
        working-directory: backend-node
        run: bun install --frozen-lockfile

      - name: Prisma generate
        working-directory: backend-node
        run: bun run db:generate

      - name: Prisma db push (throwaway test DB)
        working-directory: backend-node
        run: bun run db:push
        env:
          DATABASE_URL: "file:./test.db"

      # Detached with nohup so the server survives across steps (the
      # runner reaps it at job teardown). Health-gated below: if the
      # backend never comes up, print its log and fail honestly.
      # Env = the same throwaway-DB + throwaway-secret pattern as the
      # backend-node job above (never the production dev.db; ≥16-char
      # JWT floor; catalog from the dist/effects.json built earlier).
      - name: Start backend (tsx on :4000)
        working-directory: backend-node
        run: nohup bun run dev > ../backend-e2e.log 2>&1 &
        env:
          DATABASE_URL: "file:./test.db"
          JWT_SECRET: "ci-e2e-jwt-secret-not-for-production-use-64chars"
          JWT_REFRESH_SECRET: "ci-e2e-jwt-refresh-secret-different-64chars"
          EFFECTS_DATA_PATH: "../dist/effects.json"

      - name: Wait for backend health (/api/v1/health)
        run: |
          timeout 120 bash -c 'until curl -sf --max-time 2 http://localhost:4000/api/v1/health > /dev/null; do sleep 2; done' \
            || { echo "::error::backend did not become healthy on :4000"; cat backend-e2e.log; exit 1; }
          echo "backend healthy: $(curl -sf http://localhost:4000/api/v1/health)"

      - name: Production build (next build)
        run: bun run build

      - name: Start frontend (next start on :3000)
        run: nohup bun run start > frontend-e2e.log 2>&1 &

      - name: Wait for frontend (:3000)
        run: |
          timeout 180 bash -c 'until curl -sf --max-time 2 http://localhost:3000 > /dev/null; do sleep 2; done' \
            || { echo "::error::frontend did not become healthy on :3000"; cat frontend-e2e.log; cat backend-e2e.log; exit 1; }

      - name: E2E tests (Playwright, chromium)
        run: bunx playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e
          path: |
            playwright-report/
            test-results/
            backend-e2e.log
            frontend-e2e.log
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Perf gate (issue #84 / PF-006) — page-level performance budgets.
  # `bun run perf:budget` (scripts/perf-budget.ts) is self-contained:
  # it verifies .next/BUILD_ID, starts `next start` on :3310, measures
  # runtime metrics with headless Chromium (Playwright), parses the
  # worst-of-N Lighthouse reports produced by the LHCI step, writes
  # perf/results/budget-report.json, and exits non-zero when any metric
  # breaches its perf/budget.json budget. Requires a production build.
  # Lighthouse runs FIRST (LHCI `collect` + `assert`) so the budget gate
  # can consume .lighthouseci/ reports; the LHCI assertions themselves
  # (lighthouserc.json) also gate this job independently.
  # ─────────────────────────────────────────────────────────────────────
  perf-gate:
    name: Perf gate — budget.json + Lighthouse
    # Pushes to main only — on pull requests the identical gate runs in
    # .github/workflows/lighthouse.yml (which additionally posts the
    # scores as a PR comment), so running both would duplicate ~4 min of
    # Chromium measurement per PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: bunx playwright install chromium --with-deps

      - name: Production build (next build)
        run: bun run build

      - name: Lighthouse CI (collect + assert, worst-of-3)
        run: |
          bunx @lhci/cli autorun --config=lighthouserc.json || {
            # `autorun` includes an `upload` section pointed at temporary
            # public storage; on runner-network hiccups we still want the
            # assert results — rerun collect+assert only.
            bunx @lhci/cli collect --config=lighthouserc.json
            bunx @lhci/cli assert --config=lighthouserc.json
          }

      - name: Performance budget gate (perf:budget)
        run: bun run perf:budget --require-lighthouse

      - name: Upload budget report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-budget-report
          path: perf/results/budget-report.json
          if-no-files-found: warn
          retention-days: 30
